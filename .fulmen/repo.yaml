# .fulmen/repo.yaml: what this repo claims to be. Written against the
# repository-classes standard; verified by manual convention review until the
# planned contract:taxonomy/v0/repo-declaration.schema.json schema and checker land.
schema: "contract:taxonomy/v0/repo-declaration.schema.json"
class: prims
profile: B  # locked parallel pure-Go and Rust implementations
profile_status: bootstrapping  # flips to locked once the Go twin passes the conformance pin and make crosscheck
leaf: true  # depends on no other prim; scripts/deps-check.sh enforces it
category: library
env_prefix: YAMLPRIMS_
umbrella_prefix: null
surfaces: [library, cli]
bindings:
  rust: planned  # crates/yamlprims (working tree in this repo; unpublished on crates.io until v0.1.0)
  go: planned  # github.com/3leaps/yamlprims/yaml (pure-Go twin, CGO_ENABLED=0, stdlib-only)
  typescript: planned  # @3leaps/yamlprims (npm), bindings/typescript (wasm32, no imports)
  python: planned  # yamlprims (PyPI), bindings/python (PyO3/maturin, abi3)
target_registries: [crates_io, go_proxy, npm, pypi]
extensions:
  - id: typescript-wasm-binding
    scope: typescript
    reason: "zero-import wasm32-unknown-unknown module per ADR-0004 and canonprims pattern; no native N-API prebuilds"

# Fuzz targets for the Rust core. Not published and not a workspace member:
# the published crates never depend on libfuzzer-sys. See README.md.
[package]
name = "yamlprims-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
# The libFuzzer binaries need this; `cargo test` (the stable replay) does not.
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "=0.4.13", optional = true }
serde = "1"
serde_json = "1"
yamlprims = { path = "../crates/yamlprims" }

[lib]
name = "yamlprims_fuzz"
path = "src/lib.rs"

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "decode_wire"
path = "fuzz_targets/decode_wire.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "emit_round_trip"
path = "fuzz_targets/emit_round_trip.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "lint_yaml11"
path = "fuzz_targets/lint_yaml11.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

# Not a workspace member: the root manifest excludes fuzz/, so this crate is
# resolved on its own with fuzz/Cargo.lock.
[profile.release]
debug = 1

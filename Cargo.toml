[workspace]
members = ["crates/yamlprims", "crates/yamlprims-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3leaps/yamlprims"

[workspace.dependencies]
granit-parser = { version = "=2.0.0", default-features = false, features = ["std", "error_messages"] }
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
